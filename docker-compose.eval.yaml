# Offline AView pipeline wiring check. Synthetic judgments and data are not an accuracy score.
# Use a new output directory on every run:
# docker compose -f docker-compose.yaml -f docker-compose.eval.yaml run --rm eval-pipeline
services:
  eval-pipeline:
    image: ${CLAVIEW_BACKEND_IMAGE:-claview-backend:latest}
    profiles: ["eval"]
    network_mode: none
    working_dir: /claview
    volumes:
      - ./runs:/claview/runs
    environment:
      PYTHONHASHSEED: "0"
      CLAVIEW_MODE: synthetic
    command: ["python", "-m", "claview_pipeline", "evaluate", "--as-of", "${EVAL_AS_OF:-2026-10-29}", "--out", "${EVAL_OUT:-runs/pipeline-check}"]
