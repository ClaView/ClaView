[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "claview"
version = "0.1.0"
description = "KOSIS statistics agent: A table selection (claview.a), B series/period selection (claview.b), one flow (claview.pipeline)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "langgraph>=1.2,<2",
    "claview-period==0.2.0",
]

[tool.uv.sources]
# The shared period package (resolver, policy file, contract) lives in this repository.
claview-period = { path = "packages/claview-period", editable = true }

[project.scripts]
claview = "claview.b.cli:main"
claview-pipeline = "claview.pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.pytest.ini_options]
# Run the suites as separate pytest processes (README): tests/a installs an import guard
# that refuses `claview.b` and `claview.pipeline`, so A and B tests cannot share one process.
# A bare `pytest` runs the B suite only (as before the move).
testpaths = ["tests/b"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Copied code keeps its own style: A v1 (N5) inside B (src/claview/b/aflow), and A completion-2 (src/claview/a, tests/a,
# its scripts and reference data) copied from the fixed copy. New integration code is linted.
extend-exclude = ["src/claview/b/aflow", "src/claview/a", "tests/a", "reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
