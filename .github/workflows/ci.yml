name: ci

on:
  pull_request:
  push:
    branches: [main]

# Minimal token rights: checkout reads the code; dorny/paths-filter reads the pull request's changed files.
permissions:
  contents: read
  pull-requests: read

env:
  PYTHONHASHSEED: "0"
  PYTHONPATH: common:modules/a:modules/b:modules/c:pipeline

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      a: ${{ steps.f.outputs.a }}
      b: ${{ steps.f.outputs.b }}
      c: ${{ steps.f.outputs.c }}
      pipeline: ${{ steps.f.outputs.pipeline }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared: ['common/**', 'requirements*.txt', 'pyproject.toml', 'data/**', 'eval/cases/**']
            a: ['modules/a/**', 'common/**', 'requirements*.txt', 'data/**', 'eval/cases/**']
            b: ['modules/b/**', 'common/**', 'requirements*.txt', 'data/**', 'eval/cases/**']
            c: ['modules/c/**', 'common/**', 'requirements*.txt']
            pipeline: ['pipeline/**', 'modules/**', 'common/**', 'frontend/**', 'requirements*.txt', 'Dockerfile', 'docker-compose*.yaml']

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: lint-imports
      - run: python -B -X utf8 -m pytest common/tests -q -p no:cacheprovider

  module-a:
    needs: changes
    if: needs.changes.outputs.a == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - id: deps
        run: pip install -r requirements-dev.txt
      # Each A suite runs even when an earlier one failed (the job still fails); not after a cancel or a failed install.
      - name: A new package (modules/a/tests)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: PYTHONPATH=modules/a python -B -X utf8 -m pytest modules/a/tests -q -p no:cacheprovider
      - name: A table-level path (modules/a/tests_tl, evaluation bundle not connected)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: PYTHONPATH=modules/a python -B -X utf8 -m pytest modules/a/tests_tl -q -p no:cacheprovider
      - name: A legacy for the screen (modules/a/tests_legacy)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: PYTHONPATH=modules/a python -B -X utf8 -m pytest modules/a/tests_legacy -q -p no:cacheprovider
      - name: A API (modules/a/tests_api)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python -B -X utf8 -m pytest modules/a/tests_api -q -p no:cacheprovider

  module-b:
    needs: changes
    if: needs.changes.outputs.b == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: python -B -X utf8 -m pytest modules/b/tests -q -p no:cacheprovider
      - run: python -B -X utf8 -m pytest modules/b/tests_api -q -p no:cacheprovider

  module-c:
    needs: changes
    if: needs.changes.outputs.c == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: python -B -X utf8 -m pytest modules/c/tests -q -p no:cacheprovider

  pipeline:
    needs: changes
    if: needs.changes.outputs.pipeline == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: python -B -X utf8 -m pytest pipeline/tests -q -p no:cacheprovider
      - run: python -B -X utf8 -m pytest pipeline/tests_api -q -p no:cacheprovider
      - name: Docker stack smoke (synthetic mode)
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
          curl -fsS http://localhost:10300/health
          curl -fsS http://localhost:10301/health
          curl -fsS http://localhost:10311/health && curl -fsS http://localhost:10312/health && curl -fsS http://localhost:10313/health
          curl -fsS -X POST http://localhost:10311/a/select -H 'Content-Type: application/json' -d @common/fixtures/a_http_request/focus_model_scope.json > /dev/null
          curl -fsS -X POST http://localhost:10311/a/legacy/select -H 'Content-Type: application/json' -d @common/fixtures/a_request/CV-AB-12.json > /dev/null
      - if: always()
        run: docker compose down
